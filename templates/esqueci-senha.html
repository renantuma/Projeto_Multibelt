<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <a href="{{ url_for('home') }}" aria-label="Grupo Multibelt - Voltar para home">
          <img src="{{ url_for('static', filename='images/logo multibelt.svg') }}" alt="Grupo Multibelt" />
        </a>
      </div>
      <nav class="main-nav" role="navigation">
        <a href="{{ url_for('home') }}" class="nav-link active">Início</a>
        <a href="#sobre" class="nav-link">Sobre</a>
        {% if session.usuario_nome %}
          <!-- Usuário logado - mostra dropdown com username -->
          <div class="user-dropdown">
            <button class="user-menu-toggle nav-link nav-link-cta">
              <span class="user-greeting">Olá, {{ session.usuario_nome }}</span>
              <span class="dropdown-arrow">▼</span>
            </button>
            <div class="user-dropdown-menu">
              <a href="{{ url_for('admin') }}" class="dropdown-item">Painel Admin</a>
              <a href="{{ url_for('logout') }}" class="dropdown-item">Sair</a>
            </div>
          </div>
        {% else %}
          <!-- Usuário não logado - mostra botão de login -->
          <a href="{{ url_for('login') }}" class="nav-link nav-link-cta">Login</a>
        {% endif %}
      </nav>
      <button class="mobile-menu-toggle" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

    <div class="company-text">Grupo Multibelt</div>

    <div class="login-container">
        <form class="login-form" action="#" method="post">
            <h2>RECUPERAR SENHA</h2>
            
            <p class="form-description">
                Insira seu e-mail e enviaremos um link para você redefinir sua senha.
            </p>

            <div class="input-group">
                <label for="email">Seu E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <button type="submit" class="login-button">Enviar Link de Recuperação</button>
            
            <div class="extra-links">
                <a href="{{ url_for('login') }}">Lembrou a senha? Voltar ao Login</a>
            </div>
        </form>
    </div>

</body>
</html>
